<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f8;font-family:Segoe UI,Tahoma,sans-serif;color:#111827}.card{width:min(420px,calc(100% - 32px));background:#fff;padding:28px;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.06)}h1{margin-top:0}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-size:16px;cursor:pointer}.msg{margin-top:14px;min-height:24px;color:#b91c1c}.link{text-align:center;margin-top:16px}
  </style>
</head>
<body>
  <main class="card">
    <h1>إنشاء حساب</h1>
    <form id="form">
      <label for="name">الاسم</label>
      <input id="name" type="text" minlength="2" maxlength="80" required />
      <label for="email">الإيميل</label>
      <input id="email" type="email" required />
      <label for="password">الباسورد</label>
      <input id="password" type="password" minlength="8" required />
      <button id="btn">إنشاء الحساب</button>
      <div id="msg" class="msg"></div>
    </form>
    <div class="link">عندك حساب؟ <a href="/login">تسجيل الدخول</a></div>
  </main>
  <script src="/auth.js"></script>
  <script>
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();

      const btn = document.getElementById("btn");
      const msg = document.getElementById("msg");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");

      btn.disabled = true;
      msg.textContent = "";

      try {
        const result = await todoAuth.apiRequest("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            name: nameInput.value.trim(),
            email: emailInput.value.trim(),
            password: passwordInput.value,
          }),
        });

        todoAuth.setAuth(result.data);
        window.location.href = "/tasks";
      } catch (error) {
        msg.textContent = error.message || "حدث خطأ أثناء إنشاء الحساب";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
